spring:
  application:
    name: music-catalog
  datasource:
    url: jdbc:h2:file:./data/musicdb
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
