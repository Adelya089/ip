spring:
  application:
    name: music-catalog
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/master.yml
    drop-first: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ЛР 5: JWT — по примеру преподавателя
jwt:
  issuer: http://music-catalog.local/
  access-ttl: 15m
  refresh-ttl: 14d
