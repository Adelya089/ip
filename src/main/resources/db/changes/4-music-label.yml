
databaseChangeLog:
  - changeSet:
      id: create-music-label
      author: student
      changes:
        - createSequence:
            sequenceName: music_label_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: music_label
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_music_label
                    nullable: false

              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
