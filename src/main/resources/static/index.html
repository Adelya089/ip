<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Музыкальная база</title>
    <style>
        body {
            background-color: #6a4c93;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            margin-top: 10px;
            display: none;
        }
        th, td {
            border: 1px solid #ffffff;
            padding: 6px;
            color: #ffffff;
        }
        th {
            background-color: #8a6bb0;
        }
        input, select {
            padding: 4px;
            margin: 2px;
        }
        button {
            padding: 4px 10px;
            margin: 2px;
            cursor: pointer;
        }
        h1, h2 {
            color: #ffffff;
        }
        hr {
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>

<h1>Музыкальная база</h1>

<hr>
<h2>Жанры</h2>
<form id="genreForm">
    <input type="text" id="genreName" placeholder="Название" required>
    <button type="submit">Добавить</button>
</form>
<table id="genresTableWrapper">
    <thead>
    <tr><th>ID</th><th>Название</th><th>Действия</th></tr>
    </thead>
    <tbody id="genresTable"></tbody>
</table>

<hr>
<h2>Артисты</h2>
<form id="artistForm">
    <input type="text" id="artistName" placeholder="Имя" required>
    <input type="text" id="artistCountry" placeholder="Страна" required>
    <select id="artistGenreId" required></select>
    <button type="submit">Добавить</button>
</form>
<table id="artistsTableWrapper">
    <thead>
    <tr><th>ID</th><th>Имя</th><th>Страна</th><th>Жанр</th><th>Действия</th></tr>
    </thead>
    <tbody id="artistsTable"></tbody>
</table>

<hr>
<h2>Альбомы</h2>
<form id="albumForm">
    <input type="text" id="albumTitle" placeholder="Название" required>
    <input type="number" id="albumYear" placeholder="Год" required>
    <select id="albumArtistId" required></select>
    <input type="number" id="albumTrackCount" placeholder="Треков" required>
    <button type="submit">Добавить</button>
</form>
<table id="albumsTableWrapper">
    <thead>
    <tr><th>ID</th><th>Название</th><th>Год</th><th>Артист</th><th>Треков</th><th>Действия</th></tr>
    </thead>
    <tbody id="albumsTable"></tbody>
</table>

<script>
    const API = '/api/1.0';

    async function loadGenres() {
        const res = await fetch(API + '/genres');
        const genres = await res.json();

        const wrapper = document.getElementById('genresTableWrapper');
        const tbody = document.getElementById('genresTable');

        if (genres.length === 0) {
            wrapper.style.display = 'none';
        } else {
            wrapper.style.display = 'table';
            tbody.innerHTML = genres.map(g =>
                `<tr>
                    <td>${g.id}</td>
                    <td>${g.name}</td>
                    <td>
                        <button onclick="editGenre(${g.id}, '${g.name}')">Ред.</button>
                        <button onclick="deleteGenre(${g.id})">Удал.</button>
                    </td>
                 </tr>`
            ).join('');
        }

        const options = genres.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        document.getElementById('artistGenreId').innerHTML = options;
    }

    document.getElementById('genreForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('genreName').value;
        await fetch(API + '/genres', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name})
        });
        document.getElementById('genreName').value = '';
        loadGenres();
    };

    async function editGenre(id, oldName) {
        const name = prompt('Новое название жанра:', oldName);
        if (!name) return;
        await fetch(API + '/genres/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name})
        });
        loadGenres();
    }

    async function deleteGenre(id) {
        await fetch(API + '/genres/' + id, {method: 'DELETE'});
        loadGenres();
    }

    async function loadArtists() {
        const res = await fetch(API + '/artists');
        const artists = await res.json();

        const wrapper = document.getElementById('artistsTableWrapper');
        const tbody = document.getElementById('artistsTable');

        if (artists.length === 0) {
            wrapper.style.display = 'none';
        } else {
            wrapper.style.display = 'table';
            tbody.innerHTML = artists.map(a =>
                `<tr>
                    <td>${a.id}</td>
                    <td>${a.name}</td>
                    <td>${a.country}</td>
                    <td>${a.genre ? a.genre.name : ''}</td>
                    <td>
                        <button onclick="editArtist(${a.id}, '${a.name}', '${a.country}', ${a.genre ? a.genre.id : 0})">Ред.</button>
                        <button onclick="deleteArtist(${a.id})">Удал.</button>
                    </td>
                 </tr>`
            ).join('');
        }

        const options = artists.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
        document.getElementById('albumArtistId').innerHTML = options;
    }

    document.getElementById('artistForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('artistName').value;
        const country = document.getElementById('artistCountry').value;
        const genreId = parseInt(document.getElementById('artistGenreId').value);
        await fetch(API + '/artists', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, country, genreId})
        });
        document.getElementById('artistName').value = '';
        document.getElementById('artistCountry').value = '';
        loadArtists();
    };

    async function editArtist(id, oldName, oldCountry, oldGenreId) {
        const name = prompt('Имя артиста:', oldName);
        if (!name) return;
        const country = prompt('Страна:', oldCountry);
        if (!country) return;
        const genreId = parseInt(prompt('ID жанра:', oldGenreId));
        if (!genreId) return;
        await fetch(API + '/artists/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, country, genreId})
        });
        loadArtists();
    }

    async function deleteArtist(id) {
        await fetch(API + '/artists/' + id, {method: 'DELETE'});
        loadArtists();
    }

    async function loadAlbums() {
        const res = await fetch(API + '/albums');
        const albums = await res.json();

        const wrapper = document.getElementById('albumsTableWrapper');
        const tbody = document.getElementById('albumsTable');

        if (albums.length === 0) {
            wrapper.style.display = 'none';
        } else {
            wrapper.style.display = 'table';
            tbody.innerHTML = albums.map(a =>
                `<tr>
                    <td>${a.id}</td>
                    <td>${a.title}</td>
                    <td>${a.year}</td>
                    <td>${a.artist ? a.artist.name : ''}</td>
                    <td>${a.trackCount}</td>
                    <td>
                        <button onclick="editAlbum(${a.id}, '${a.title}', ${a.year}, ${a.artist ? a.artist.id : 0}, ${a.trackCount})">Ред.</button>
                        <button onclick="deleteAlbum(${a.id})">Удал.</button>
                    </td>
                 </tr>`
            ).join('');
        }
    }

    document.getElementById('albumForm').onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById('albumTitle').value;
        const year = parseInt(document.getElementById('albumYear').value);
        const artistId = parseInt(document.getElementById('albumArtistId').value);
        const trackCount = parseInt(document.getElementById('albumTrackCount').value);
        const cover = '';
        await fetch(API + '/albums', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, year, artistId, trackCount, cover})
        });
        document.getElementById('albumTitle').value = '';
        document.getElementById('albumYear').value = '';
        document.getElementById('albumTrackCount').value = '';
        loadAlbums();
    };

    async function editAlbum(id, oldTitle, oldYear, oldArtistId, oldTrackCount) {
        const title = prompt('Название альбома:', oldTitle);
        if (!title) return;
        const year = parseInt(prompt('Год:', oldYear));
        if (!year) return;
        const artistId = parseInt(prompt('ID артиста:', oldArtistId));
        if (!artistId) return;
        const trackCount = parseInt(prompt('Количество треков:', oldTrackCount));
        if (!trackCount) return;
        const cover = '';
        await fetch(API + '/albums/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, year, artistId, trackCount, cover})
        });
        loadAlbums();
    }

    async function deleteAlbum(id) {
        await fetch(API + '/albums/' + id, {method: 'DELETE'});
        loadAlbums();
    }

    loadGenres();
    loadArtists();
    loadAlbums();
</script>

</body>
</html>
