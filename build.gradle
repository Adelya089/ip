
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:5.0.3'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.liquibase.gradle' version '3.1.0'
}
group = 'ru.ulstu.is'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2:2.5.252'
    liquibaseRuntime 'org.liquibase:liquibase-core:5.0.3'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
    liquibaseRuntime 'com.h2database:h2:2.5.252'
    liquibaseRuntime sourceSets.main.runtimeClasspath
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }

// ЛР №4: dev по умолчанию; -Pprod выбирает PostgreSQL.
def activeProfile = project.hasProperty('prod') ? 'prod' : 'dev'
tasks.named('bootRun') {
    args '--spring.profiles.active=' + activeProfile
}
tasks.named('test') {
    systemProperty 'spring.profiles.active', 'test'
}
liquibase {
    activities {
        main {
            changelogFile 'db/master.yml'
            url project.hasProperty('rollbackDemo') ?
                    'jdbc:h2:file:./data/musicdb_rollback' :
                    'jdbc:h2:file:./data/musicdb_lab4'
            username 'sa'
            password 'sa'
        }
    }
    runList = 'main'
}
if (activeProfile == 'dev') {
    apply from: 'build.migrations.gradle'
}
// Gradle-плагин предоставляет update, status, rollbackCount, generateChangelog, diffChangelog.
